name: Regression Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  regression-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            setup.py
            packages/groundcheck/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run regression gate tests
        run: |
          pytest -q \
            tests/test_chat_pipeline_regressions.py \
            tests/test_web_answer_policy.py \
            tests/test_memory_write_guard.py \
            tests/test_endpoint_parity_ci.py \
            tests/test_heartbeat_executor_plumbing.py
