[project]
name = "belief-classifier"
version = "0.1.0"
description = "XGBoost contradiction classifier for CRT belief/policy decisions"
requires-python = ">=3.10"
dependencies = [
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["belief_classifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
