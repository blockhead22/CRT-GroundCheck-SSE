<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRT - Force Logout</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin-bottom: 1rem;
        }
        .status {
            margin: 2rem 0;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #5568d3;
        }
        .detail {
            margin-top: 1rem;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 CRT Force Logout</h1>
        <div id="status" class="status info">
            Click the button below to clear all authentication data
        </div>
        <button onclick="clearAuth()">Clear Auth & Reload</button>
        <div class="detail" id="detail"></div>
    </div>

    <script>
        function clearAuth() {
            const status = document.getElementById('status');
            const detail = document.getElementById('detail');
            
            // Clear auth token
            const hadToken = localStorage.getItem('crt_auth_token') !== null;
            localStorage.removeItem('crt_auth_token');
            
            // Clear chat storage
            const hadChats = localStorage.getItem('crt-chat-state') !== null;
            localStorage.removeItem('crt-chat-state');
            
            // Clear any other CRT data
            const keys = Object.keys(localStorage);
            const crtKeys = keys.filter(k => k.toLowerCase().includes('crt'));
            crtKeys.forEach(key => localStorage.removeItem(key));
            
            // Clear session storage too
            sessionStorage.clear();
            
            status.className = 'status success';
            status.textContent = '✓ All authentication data cleared!';
            
            detail.innerHTML = `
                <strong>Cleared:</strong><br>
                ${hadToken ? '✓ Auth token' : '○ No auth token'}<br>
                ${hadChats ? '✓ Chat history' : '○ No chat history'}<br>
                ✓ All CRT localStorage (${crtKeys.length} keys)<br>
                ✓ Session storage<br><br>
                <em>Reloading page in 2 seconds...</em>
            `;
            
            // Reload after showing message
            setTimeout(() => {
                window.location.href = '/';
            }, 2000);
        }
        
        // Show current storage state on load
        window.addEventListener('load', () => {
            const detail = document.getElementById('detail');
            const token = localStorage.getItem('crt_auth_token');
            const chats = localStorage.getItem('crt-chat-state');
            const keys = Object.keys(localStorage).filter(k => k.toLowerCase().includes('crt'));
            
            detail.innerHTML = `
                <strong>Current State:</strong><br>
                Auth Token: ${token ? '✓ Present' : '○ None'}<br>
                Chat Storage: ${chats ? '✓ Present' : '○ None'}<br>
                CRT Keys: ${keys.length} total
            `;
        });
    </script>
</body>
</html>
