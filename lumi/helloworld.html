<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .content {
            text-align: center;
            padding: 40px;
            background-color: #ffffff;
            border: 1px solid #ccc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 4px;
        }
        h1 {
            margin: 0 0 20px;
            color: #333;
        }
        p {
            color: #555;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Hello, World!</h1>
        <p>This is a flat style centered webpage.</p>
    </div>
</body>
</html>
